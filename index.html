<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="AI Assistant powered by Copilot Studio">
    <title>AI Assistant - Copilot Studio</title>
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            height: 100%;
            width: 100%;
            overflow: hidden;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen', 'Ubuntu', 'Cantarell', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .container {
            width: 100%;
            height: 100%;
            max-width: 1200px;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        .header {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            padding: 1.5rem;
            border-bottom: 1px solid rgba(255, 255, 255, 0.2);
            color: white;
            box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.37);
        }

        .header h1 {
            font-size: 1.8rem;
            font-weight: 700;
            letter-spacing: -0.5px;
        }

        .header p {
            font-size: 0.9rem;
            opacity: 0.9;
            margin-top: 0.3rem;
        }

        .chat-wrapper {
            flex: 1;
            display: flex;
            overflow: hidden;
        }

        .chat-container {
            width: 100%;
            height: 100%;
            padding: 1.5rem;
            border-radius: 16px 16px 0 0;
            background: white;
            box-shadow: inset 0 -2px 8px rgba(0, 0, 0, 0.1);
        }

        .chat-container iframe {
            width: 100%;
            height: 100%;
            border: none;
            border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.15);
        }

        .footer {
            background: rgba(255, 255, 255, 0.95);
            padding: 1rem 1.5rem;
            text-align: center;
            font-size: 0.85rem;
            color: #666;
            border-top: 1px solid rgba(0, 0, 0, 0.05);
        }

        @media (max-width: 768px) {
            .header h1 {
                font-size: 1.4rem;
            }

            .chat-container {
                padding: 1rem;
            }
        }

        /* 스크롤바 스타일 */
        ::-webkit-scrollbar {
            width: 8px;
        }

        ::-webkit-scrollbar-track {
            background: rgba(0, 0, 0, 0.05);
        }

        ::-webkit-scrollbar-thumb {
            background: #667eea;
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #764ba2;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>💬 AI Assistant</h1>
            <p>Powered by Copilot Studio</p>
        </div>

        <div class="chat-wrapper">
            <div class="chat-container">
                <iframe 
                    src="https://copilotstudio.microsoft.com/environments/9324e73a-cd4e-e049-b7ba-177af6165e9c/bots/crbf2_multimodelaiagent_Gasm8P/webchat?__version__=2&enableFileAttachment=false&cliAgent=true" 
                    title="Copilot Studio Chat Interface"
                    loading="lazy">
                </iframe>
            </div>
        </div>

        <div class="footer">
            <p>© 2024 AI Assistant. Powered by Microsoft Copilot Studio.</p>
        </div>
    </div>
</body>
</html>
