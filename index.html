  <style>
    :root {
      --page: #f3f5f7;
      --page-accent: #e8edf4;
      --glass: rgba(255, 255, 255, 0.72);
      --glass-strong: rgba(255, 255, 255, 0.9);
      --line: rgba(27, 38, 55, 0.1);
      --line-strong: rgba(27, 38, 55, 0.16);
      --ink: #172033;
      --muted: #687386;
      --quiet: #8e98a8;
      --accent: #7c4dff; /* 변경: 보라색 계열 메인 강조색 */
      --accent-soft: rgba(124,77,255,.08); /* 변경: 보라 연한색 (배경/배지 등) */
      --danger: #c63d49;
      --shadow: 0 18px 60px rgba(25, 39, 61, 0.09);
      --radius-xl: 26px;
      --radius-lg: 18px;
      --radius-md: 13px;
      --sidebar-width: 282px;
      --ease: 180ms cubic-bezier(.2, .75, .25, 1);
    }

    * { box-sizing: border-box; }

    html, body { height: 100%; }

    body {
      margin: 0;
      overflow: hidden;
      color: var(--ink);
      background:
        radial-gradient(circle at 12% 8%, rgba(255,255,255,.98) 0 16%, transparent 42%),
        radial-gradient(circle at 88% 92%, rgba(218,228,243,.7), transparent 38%),
        linear-gradient(135deg, var(--page), var(--page-accent));
      font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    button, select, textarea { font: inherit; }

    button, select { -webkit-tap-highlight-color: transparent; }

    button:focus-visible, select:focus-visible, textarea:focus-visible {
      outline: 3px solid rgba(124,77,255,.2); /* 변경: 보라 강조 아웃라인 */
      outline-offset: 2px;
    }

    .app-shell {
      width: min(1540px, calc(100% - 28px));
      height: min(940px, calc(100% - 28px));
      margin: 14px auto;
      display: grid;
      grid-template-columns: var(--sidebar-width) minmax(0, 1fr);
      border: 1px solid rgba(255,255,255,.86);
      border-radius: var(--radius-xl);
      overflow: hidden;
      background: rgba(255,255,255,.42);
      box-shadow: var(--shadow);
      backdrop-filter: blur(30px) saturate(135%);
      -webkit-backdrop-filter: blur(30px) saturate(135%);
    }

    .sidebar {
      position: relative;
      min-width: 0;
      display: flex;
      flex-direction: column;
      padding: 20px 14px 14px;
      border-right: 1px solid var(--line);
      background: rgba(246, 248, 251, .74);
      z-index: 5;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 11px;
      padding: 2px 8px 18px;
    }

    .brand-mark {
      width: 34px;
      height: 34px;
      display: grid;
      place-items: center;
      border: 1px solid var(--line);
      border-radius: 11px;
      color: white;
      background: linear-gradient(145deg, #252f43, #111827);
      box-shadow: 0 7px 18px rgba(19, 29, 47, .16);
      font-size: 20px;
      font-weight: 760;
      letter-spacing: -.04em;
    }

    .brand-copy strong { display: block; font-size: 15px; letter-spacing: -.015em; }
    .brand-copy span { display: block; margin-top: 2px; color: var(--quiet); font-size: 11px; }

    .new-chat {
      width: 100%;
      min-height: 44px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      border: 1px solid var(--line-strong);
      border-radius: var(--radius-md);
      color: var(--ink);
      background: var(--glass-strong);
      cursor: pointer;
      transition: transform var(--ease), border-color var(--ease), background var(--ease);
    }

    .new-chat:hover { transform: translateY(-1px); border-color: rgba(124,77,255,.25); background: #fff; } /* 변경: 호버 테두리 보라색 */

    .section-label {
      margin: 21px 9px 8px;
      color: var(--quiet);
      font-size: 20px;
      font-weight: 680;
      letter-spacing: .06em;
      text-transform: uppercase;
    }

    .chat-list {
      min-height: 0;
      flex: 1;
      overflow: auto;
      padding: 0 2px 10px;
      scrollbar-width: thin;
      scrollbar-color: rgba(80,91,108,.22) transparent;
    }

    .chat-item {
      position: relative;
      width: 100%;
      min-height: 48px;
      margin: 2px 0;
      display: grid;
      grid-template-columns: minmax(0,1fr) auto;
      gap: 8px;
      align-items: center;
      padding: 8px 8px 8px 11px;
      border: 1px solid transparent;
      border-radius: 12px;
      color: inherit;
      background: transparent;
      text-align: left;
      cursor: pointer;
    }

    .chat-item:hover { background: rgba(255,255,255,.68); }
    .chat-item[aria-current="true"] { border-color: var(--line); background: rgba(255,255,255,.86); }
    .chat-main { min-width: 0; }
    .chat-title { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 13px; font-weight: 590; }
    .chat-meta { margin-top: 4px; color: var(--quiet); font-size: 10px; }

    .item-menu {
      width: 30px;
      height: 30px;
      display: grid;
      place-items: center;
      border: 0;
      border-radius: 9px;
      color: var(--muted);
      background: transparent;
      cursor: pointer;
      opacity: .2;
    }

    .chat-item:hover .item-menu, .item-menu:focus-visible { opacity: 1; }

    .sidebar-footer { padding: 12px 6px 2px; border-top: 1px solid var(--line); }

    .history-notice {
      margin: 0;
      padding: 3px 6px 1px;
      color: var(--quiet);
      font-size: 10.5px;
      line-height: 1.55;
      word-break: keep-all;
    }

    .delete-chat { color: var(--quiet); }
    .delete-chat:hover { color: var(--danger); background: rgba(198,61,73,.07); }

    .trash-icon {
      position: relative;
      width: 11px;
      height: 12px;
      border: 1.4px solid currentColor;
      border-top: 0;
      border-radius: 0 0 3px 3px;
    }

    .trash-icon::before {
      content: '';
      position: absolute;
      left: -2px;
      top: -4px;
      width: 13px;
      height: 1.4px;
      border-radius: 2px;
      background: currentColor;
      box-shadow: 4px -2px 0 -0.2px currentColor;
    }

    .trash-icon::after {
      content: '';
      position: absolute;
      left: 3px;
      top: 2px;
      width: 1px;
      height: 6px;
      border-radius: 1px;
      background: currentColor;
      box-shadow: 3px 0 0 currentColor;
      opacity: .7;
    }

    .main {
      min-width: 0;
      min-height: 0;
      display: grid;
      grid-template-rows: auto minmax(0,1fr) auto;
      background: rgba(255,255,255,.56);
    }

    .topbar {
      min-height: 72px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 13px clamp(15px, 3vw, 34px);
      border-bottom: 1px solid var(--line);
      background: rgba(255,255,255,.58);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      z-index: 3;
    }

    .topbar-left { min-width: 0; display: flex; align-items: center; gap: 12px; }
    .mobile-menu { display: none; }
    .session-copy { min-width: 0; }
    .session-title { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 14px; font-weight: 670; }

    .route-control { display: flex; align-items: center; gap: 9px; }

    .route-badge {
      max-width: 220px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      padding: 6px 9px;
      border: 1px solid rgba(124,77,255,.13); /* 변경: 보라 테두리 */
      border-radius: 999px;
      color: #5b3ec0; /* 변경: 보라 계열 텍스트 */
      background: var(--accent-soft);
      font-size: 10px;
      font-weight: 700;
      letter-spacing: .01em;
    }

    .model-select {
      min-height: 40px;
      max-width: 210px;
      padding: 0 36px 0 12px;
      border: 1px solid var(--line-strong);
      border-radius: 12px;
      color: var(--ink);
      background: rgba(255,255,255,.86);
      cursor: pointer;
    }

    .workspace { position: relative; min-height: 0; overflow: hidden; }
    #webchat, #archive { width: 100%; height: 100%; }
    #webchat { background: transparent; }
    .webchat-mount { width: 100%; height: 100%; min-height: 0; }

    .state-panel, .empty-state {
      height: 100%;
      display: grid;
      place-items: center;
      padding: 28px;
    }

    .state-card, .empty-card {
      width: min(560px, 100%);
      padding: clamp(24px, 5vw, 42px);
      border: 1px solid var(--line);
      border-radius: 24px;
      background: rgba(255,255,255,.72);
      box-shadow: 0 16px 46px rgba(30,42,61,.06);
      text-align: center;
    }

    .orb {
      width: 52px;
      height: 52px;
      margin: 0 auto 17px;
      display: grid;
      place-items: center;
      border: 1px solid rgba(124,77,255,.15); /* 변경: 보라 연한 테두리 */
      border-radius: 17px;
      color: var(--accent);
      background: linear-gradient(145deg, #fff, rgba(124,77,255,.08)); /* 변경: 보라 연한 그라디언트 */
      font-weight: 760;
      box-shadow: 0 10px 30px rgba(124,77,255,.12); /* 변경: 보라 그림자 */
    }

    .state-card h2, .empty-card h2 { margin: 0; font-size: clamp(21px, 3vw, 29px); letter-spacing: -.035em; }
    .state-card p, .empty-card p { margin: 11px auto 0; max-width: 460px; color: var(--muted); font-size: 13px; line-height: 1.65; }

    .primary-button, .secondary-button {
      min-height: 41px;
      margin-top: 19px;
      padding: 0 16px;
      border-radius: 12px;
      cursor: pointer;
    }

    .primary-button { border: 1px solid #6f4ef5; color: white; background: var(--accent); } /* 변경: 보라 테두리 + 배경 */
    .secondary-button { border: 1px solid var(--line-strong); color: var(--ink); background: white; }

    .archive-view { height: 100%; overflow: auto; padding: 30px clamp(18px, 6vw, 88px); }
    .archive-note { max-width: 760px; margin: 0 auto 22px; padding: 12px 14px; border: 1px solid var(--line); border-radius: 12px; color: var(--muted); background: rgba(255,255,255,.72); font-size: 12[...]
    .archive-message { max-width: 760px; margin: 0 auto 18px; }
    .archive-role { margin-bottom: 5px; color: var(--quiet); font-size: 10px; font-weight: 700; text-transform: uppercase; }
    .archive-bubble { display: inline-block; max-width: 86%; padding: 11px 14px; border: 1px solid var(--line); border-radius: 15px; background: rgba(255,255,255,.82); white-space: pre-wrap; overflow-[...]
    .archive-message.user { text-align: right; }
    .archive-message.user .archive-bubble { color: white; border-color: #6b47f0; /* 변경: 보라 계열 */ background: var(--accent); text-align: left; }

    .statusbar {
      min-height: 35px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 7px clamp(15px, 3vw, 34px);
      border-top: 1px solid var(--line);
      color: var(--quiet);
      background: rgba(255,255,255,.62);
      font-size: 10px;
    }

    .status-dot { width: 6px; height: 6px; display: inline-block; margin-right: 6px; border-radius: 50%; background: #a5adba; }
    .status-dot.online { background: #39a568; box-shadow: 0 0 0 3px rgba(57,165,104,.1); }
    .status-dot.error { background: var(--danger); }

    .toast {
      position: fixed;
      left: 50%;
      bottom: 28px;
      max-width: min(460px, calc(100% - 32px));
      padding: 11px 15px;
      border: 1px solid var(--line-strong);
      border-radius: 12px;
      color: var(--ink);
      background: rgba(255,255,255,.95);
      box-shadow: 0 12px 40px rgba(18,31,52,.15);
      transform: translate(-50%, 12px);
      opacity: 0;
      pointer-events: none;
      transition: opacity var(--ease), transform var(--ease);
      z-index: 20;
      font-size: 12px;
    }

    .toast.visible { opacity: 1; transform: translate(-50%, 0); }
    .sidebar-scrim { display: none; }

    @media (max-width: 780px) {
      .app-shell { width: 100%; height: 100%; margin: 0; grid-template-columns: 1fr; border: 0; border-radius: 0; }
      .sidebar { position: fixed; inset: 0 auto 0 0; width: min(310px, 86vw); transform: translateX(-102%); transition: transform var(--ease); box-shadow: 18px 0 48px rgba(20,31,50,.16); }
      body.sidebar-open .sidebar { transform: translateX(0); }
      .sidebar-scrim { position: fixed; inset: 0; display: block; border: 0; background: rgba(26,37,54,.2); opacity: 0; pointer-events: none; transition: opacity var(--ease); z-index: 4; }
      body.sidebar-open .sidebar-scrim { opacity: 1; pointer-events: auto; }
      .mobile-menu { width: 38px; height: 38px; display: grid; place-items: center; border: 1px solid var(--line); border-radius: 11px; color: var(--ink); background: rgba(255,255,255,.82); curso[...]
      .topbar { min-height: 66px; }
      .route-badge { display: none; }
      .model-select { max-width: 156px; font-size: 12px; }
      .statusbar { padding-bottom: max(7px, env(safe-area-inset-bottom)); }
    }

    @media (max-width: 470px) {
      .session-copy { display: none; }
      .topbar { padding-inline: 11px; }
      .model-select { max-width: 202px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; transition-duration: .01ms !important; animation-duration: .01ms !important; animation-iteration-count: 1 !important; }
    }
  </style>
